apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devboard-frontend-hpa
  namespace: devboard-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devboard-frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # percentage of the pod's CPU *request*, not of a whole core.
          # request 100m + target 50% means scale when usage passes 50m.
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0     # scale up immediately
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down, to avoid flapping
