<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
    input[type=url] { width: 70%; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 2rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    .result { background: #eef7ee; padding: 0.8rem; margin-top: 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form method="post">
    <input type="url" name="url" placeholder="https://example.com/very/long/path" required>
    <button type="submit">Shorten</button>
  </form>

  {% if short_url %}
  <p class="result">Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
  {% endif %}

  <h2>Recent links</h2>
  <table>
    <tr><th>Code</th><th>Target</th><th>Clicks</th></tr>
    {% for l in links %}
    <tr><td>{{ l.code }}</td><td>{{ l.target }}</td><td>{{ l.clicks }}</td></tr>
    {% else %}
    <tr><td colspan="3">Nothing yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
