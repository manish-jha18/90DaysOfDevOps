# Sends every plain-HTTP request to HTTPS. A separate route attached to the
# :80 listener only, so the HTTPS listener is unaffected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devboard-https-redirect
  namespace: devboard
spec:
  parentRefs:
    - name: devboard-gateway
      sectionName: http
  hostnames:
    - devboard.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
