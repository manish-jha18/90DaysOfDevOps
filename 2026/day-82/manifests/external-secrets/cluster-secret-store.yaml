# Cluster-scoped, so every namespace can reference it. A namespaced
# SecretStore would need one per namespace.
#
# No credentials here - the operator's ServiceAccount gets its IAM role
# through the Pod Identity association created in day-81's terraform.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
