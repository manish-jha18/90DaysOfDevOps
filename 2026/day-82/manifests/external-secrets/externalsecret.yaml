# Pulls the Postgres credentials out of AWS Secrets Manager and materialises
# them as an ordinary Kubernetes Secret. The password exists in AWS and in
# the cluster - never in git, never in a values file, never in terraform state.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devboard-secrets
  namespace: devboard
spec:
  # re-reads AWS on this interval, so a rotated password propagates without
  # a redeploy. Pods consuming it as env vars still need a restart (day 54).
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: devboard-secrets
    # Owner: the operator creates AND owns the Secret, and deletes it when
    # this ExternalSecret goes away
    creationPolicy: Owner
    deletionPolicy: Delete

    # assemble the connection string here rather than in the app, so the
    # credentials are never split across two places
    template:
      engineVersion: v2
      type: Opaque
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .dbname }}"
        POSTGRES_URL: "postgres://{{ .username }}:{{ .password }}@postgres:5432/{{ .dbname }}?sslmode=disable"

  # extract pulls every key out of one JSON secret, so .username / .password
  # / .dbname above refer to fields inside it
  dataFrom:
    - extract:
        key: devboard/postgres
