# Day 48 - what runs on a pull request: verify, never ship
name: PR Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run_tests: true

  dependency-review:
    # Day 49 - flags any NEW dependency this PR introduces that has a known CVE.
    # Only works on pull_request events, which is why it is not in main-pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  pr-summary:
    runs-on: ubuntu-latest
    needs: [build-test, dependency-review]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "PR checks for branch: ${{ github.head_ref }}"
          echo "tests             : ${{ needs.build-test.outputs.test_result }}"
          echo "dependency review : ${{ needs.dependency-review.result }}"
          {
            echo "## PR Checks"
            echo "- branch: ${{ github.head_ref }}"
            echo "- tests: ${{ needs.build-test.outputs.test_result }}"
            echo "- dependency review: ${{ needs.dependency-review.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
