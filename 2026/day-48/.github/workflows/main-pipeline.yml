# Day 48 - what runs on main: test, tag, build, scan, push, deploy
name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run_tests: true

  tag:
    # computed once, so every image in this run carries the identical tag
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      sha_tag: ${{ steps.t.outputs.sha_tag }}
    steps:
      - id: t
        run: echo "sha_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

  docker-backend:
    needs: tag
    uses: ./.github/workflows/reusable-docker.yml
    with:
      component: backend
      tag: ${{ needs.tag.outputs.sha_tag }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  docker-frontend:
    needs: tag
    uses: ./.github/workflows/reusable-docker.yml
    with:
      component: frontend
      tag: ${{ needs.tag.outputs.sha_tag }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    # a GitHub Environment. Add required reviewers in repo settings and
    # this job pauses for manual approval before running.
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "Deploying to production"
          echo "  backend : ${{ needs.docker-backend.outputs.image_url }}"
          echo "  frontend: ${{ needs.docker-frontend.outputs.image_url }}"
          {
            echo "## Deployment"
            echo "- backend: ${{ needs.docker-backend.outputs.image_url }}"
            echo "- frontend: ${{ needs.docker-frontend.outputs.image_url }}"
            echo "- commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
