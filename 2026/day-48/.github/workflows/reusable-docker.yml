# Day 48 - reusable: build one image, scan it, then push only if the scan passed
name: Reusable Docker

on:
  workflow_call:
    inputs:
      component:
        description: 'Folder and image suffix, e.g. backend'
        required: true
        type: string
      tag:
        description: 'Immutable tag, e.g. sha-8a3f91c'
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        description: 'Full image reference that was pushed'
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.meta.outputs.image_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image reference
        id: meta
        run: |
          IMAGE="${{ secrets.docker_username }}/devboard-${{ inputs.component }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_url=$IMAGE:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # load: true builds it into the local docker daemon instead of pushing,
      # so trivy has something to scan BEFORE anything ships
      - name: Build the image locally
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.component }}
          load: true
          tags: ${{ steps.meta.outputs.image_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.meta.outputs.image_url }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push only after the scan passed
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.component }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_url }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
