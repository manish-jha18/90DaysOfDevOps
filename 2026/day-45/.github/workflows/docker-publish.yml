# Day 45 - build the DevBoard images and push them to Docker Hub
name: Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # one job per folder, both run in parallel
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ secrets.DOCKER_USERNAME }}/devboard-${{ matrix.component }}"
          echo "image=$IMAGE"                    >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:sha-$SHORT_SHA"   >> "$GITHUB_OUTPUT"
          echo "latest_tag=$IMAGE:latest"        >> "$GITHUB_OUTPUT"
          echo "Tagging as sha-$SHORT_SHA and latest"

      - name: Set up Buildx
        # buildx gives the layer cache used below, and multi-platform builds
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # only on main - a PR from a fork must never get the credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          # build always; push ONLY on main
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          # reuse layers between runs - the biggest single speed win
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what happened
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Pushed ${{ steps.meta.outputs.sha_tag }}"
            echo "Pushed ${{ steps.meta.outputs.latest_tag }}"
          else
            echo "Built but did not push (not on main)"
          fi
