# Wave 0 - an operator that installs CRDs. Everything that USES those CRDs
# has to come later, which is what waves are for.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.10.4"
    helm:
      valuesObject:
        installCRDs: true
        # no credentials - the ServiceAccount gets its IAM role from the
        # Pod Identity association created in day-81's terraform
        resources:
          requests:
            cpu: 10m
            memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
