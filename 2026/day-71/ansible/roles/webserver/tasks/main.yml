---
- name: Fail early on an unsupported OS
  ansible.builtin.fail:
    msg: "The webserver role supports Debian-family systems only. Found {{ ansible_os_family }}."
  when: ansible_os_family != "Debian"

- name: Install the web server
  ansible.builtin.apt:
    name: "{{ webserver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the document root
  ansible.builtin.file:
    path: "{{ webserver_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy the landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Deploy the main config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ webserver_config_path }}"
    mode: "0644"
    # nginx -t on the candidate file. A broken template never lands on disk.
    validate: "nginx -t -c %s"
  notify: Reload webserver

- name: Deploy the site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ webserver_site_path }}"
    mode: "0644"
  notify: Reload webserver

- name: Remove the distro default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload webserver

- name: Enable the site
  ansible.builtin.file:
    src: "{{ webserver_site_path }}"
    dest: /etc/nginx/sites-enabled/devboard
    state: link
  notify: Reload webserver

- name: Start and enable the service
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
