apiVersion: v1
kind: Pod
metadata:
  name: resource-demo
  namespace: devboard-dev
spec:
  containers:
    - name: app
      image: nginx:1.25-alpine
      resources:
        # requests = what the SCHEDULER reserves. Guaranteed to the pod.
        requests:
          cpu: 100m           # 100 millicores = 0.1 of a core
          memory: 64Mi
        # limits = the hard ceiling enforced at runtime.
        # over the CPU limit -> throttled.  over the memory limit -> OOMKilled.
        limits:
          cpu: 250m
          memory: 128Mi
