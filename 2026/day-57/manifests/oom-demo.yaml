# Deliberately allocates more than its memory limit, to observe OOMKilled.
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  namespace: devboard-dev
spec:
  containers:
    - name: hungry
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
      resources:
        requests:
          memory: 50Mi
        limits:
          memory: 100Mi       # asks for 200M, allowed 100Mi -> killed
  restartPolicy: Never
