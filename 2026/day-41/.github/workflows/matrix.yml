# Day 41 Task 4 and 5 - matrix builds
name: Matrix Build

on:
  workflow_dispatch:

jobs:
  test:
    # fail-fast: false lets the other combinations finish even if one fails
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
        # 3 x 2 = 6 combinations, minus the one excluded below = 5 jobs
        exclude:
          - os: windows-latest
            python-version: '3.10'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print the version
        run: python --version

      - name: Show which combination this is
        run: echo "Running Python ${{ matrix.python-version }} on ${{ matrix.os }}"
