# App 1 - image typo. nginx:latestt does not exist, so the pod sits in
# ImagePullBackOff.
#
# Deployment, not a bare Pod. KubeHealer's fix_image action patches
# spec.template.spec.containers[].image on a Deployment - a Pod's image field
# is immutable and there is no Deployment to walk up to. See the write-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:latestt
          ports:
            - containerPort: 80
