# Day 44 Task 1 & 2 - secrets, without ever printing one
name: Secrets

on: workflow_dispatch

jobs:
  use-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secret exists without revealing it
        env:
          MSG: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$MSG" ]; then
            echo "The secret is set: true"
            echo "Length: ${#MSG} characters"
          else
            echo "The secret is set: false"
          fi

      - name: Use a secret in a command without hardcoding it
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          # piping the token in via stdin keeps it off the process list,
          # where "ps aux" on a shared runner would otherwise show it
          echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
          echo "logged in as $DOCKER_USERNAME"
