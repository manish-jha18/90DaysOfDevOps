# Day 44 Task 3 & 4 - produce a file in one job, consume it in another
name: Artifacts

on: workflow_dispatch

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate a report
        run: |
          mkdir -p reports
          {
            echo "Build report"
            echo "============"
            echo "commit : ${{ github.sha }}"
            echo "branch : ${{ github.ref_name }}"
            echo "run    : ${{ github.run_id }}"
            echo "date   : $(date -u)"
          } > reports/build-report.txt
          cat reports/build-report.txt

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/
          retention-days: 5

  consume:
    runs-on: ubuntu-latest
    needs: produce
    steps:
      - name: Download the artifact from the other job
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: incoming/

      - name: Read it
        run: |
          ls -la incoming/
          cat incoming/build-report.txt
