# Day 44 Task 5 & 6 - run the DevBoard test suites for real, with caching
name: Real Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # setup-go caches the module and build cache automatically
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

      - name: Run backend tests
        run: go test -v ./...
        working-directory: backend

      - name: Save the test log as an artifact
        if: always()      # upload even when the tests failed - that is when you want it
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            frontend/coverage/
            backend/*.out
          if-no-files-found: ignore
          retention-days: 5
