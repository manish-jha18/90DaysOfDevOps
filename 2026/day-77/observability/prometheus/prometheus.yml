global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: devboard-local

# where to send alerts once they fire
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# glob, so dropping a new file in rules/ picks it up on reload
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: devboard-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # the collector's prometheus exporter. Everything an app sends over
  # OTLP arrives here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # the collector's OWN health metrics, a different port
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
