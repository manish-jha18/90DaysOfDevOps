apiVersion: 1

providers:
  - name: devboard
    orgId: 1
    folder: DevBoard
    type: file
    disableDeletion: false
    # rescan the directory every 30s, so editing a json file updates grafana
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
