apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-config
  namespace: capstone
data:
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wordpress
  WORDPRESS_DB_HOST: mysql:3306
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secrets
  namespace: capstone
type: Opaque
# stringData: plain text, kubernetes encodes it. Far easier to review than
# base64. Local demo values only - a real password belongs in Sealed Secrets.
stringData:
  MYSQL_ROOT_PASSWORD: capstone-root-pw
  MYSQL_PASSWORD: capstone-wp-pw
