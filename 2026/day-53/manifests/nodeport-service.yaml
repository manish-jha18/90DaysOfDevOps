# Reachable from outside on <any-node-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: devboard-frontend-nodeport
  namespace: devboard-dev
spec:
  type: NodePort
  selector:
    app: devboard-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4173
      nodePort: 30080         # must be in 30000-32767; omit to get a random one
