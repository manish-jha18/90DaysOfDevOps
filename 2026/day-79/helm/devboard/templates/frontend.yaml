apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devboard.fullname" . }}-frontend
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
    component: frontend
spec:
  {{- if not .Values.frontend.hpa.enabled }}
  # omitted entirely when the HPA owns the replica count, or every helm
  # upgrade resets it and the HPA changes it back a few seconds later (day 58)
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devboard.selectorLabels" . | nindent 6 }}
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "devboard.labels" . | nindent 8 }}
        component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devboard.fullname" . }}-frontend
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "devboard.selectorLabels" . | nindent 4 }}
    component: frontend
  ports:
    - port: {{ .Values.frontend.servicePort }}
      targetPort: http
      name: http
      {{- if eq .Values.frontend.service.type "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
