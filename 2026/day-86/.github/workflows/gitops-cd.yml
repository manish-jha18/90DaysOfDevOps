# Day 86 - the GitOps CI pipeline.
#
# The critical difference from day 48: this workflow NEVER runs kubectl or
# helm. It builds an image and writes a tag into git. ArgoCD does the rest.
name: GitOps CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege. contents: write is needed only because the last job
# commits the new tag back.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- verify
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run_tests: true

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ------------------------------------------------------------------ tag
  tag:
    runs-on: ubuntu-latest
    needs: [build-test, security]
    outputs:
      sha_tag: ${{ steps.t.outputs.sha_tag }}
    steps:
      - id: t
        run: echo "sha_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- build
  docker-backend:
    needs: tag
    uses: ./.github/workflows/reusable-docker.yml
    with:
      component: backend
      tag: ${{ needs.tag.outputs.sha_tag }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  docker-frontend:
    needs: tag
    uses: ./.github/workflows/reusable-docker.yml
    with:
      component: frontend
      tag: ${{ needs.tag.outputs.sha_tag }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  # ------------------------------------------------- the GitOps handoff
  update-manifest:
    runs-on: ubuntu-latest
    needs: [tag, docker-backend, docker-frontend]
    permissions:
      contents: write
    steps:
      - name: Check out the deployment repo
        uses: actions/checkout@v4
        with:
          # In a real setup this is a SEPARATE repository. Application code
          # and deployment config in one repo means every deploy needs a
          # code review and every code change touches deployment.
          #   repository: manish-jha18/devboard-deploy
          #   token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          fetch-depth: 0

      - name: Update the image tags in values.yaml
        env:
          TAG: ${{ needs.tag.outputs.sha_tag }}
        run: |
          # yq is precise where sed is not - it edits the YAML structure
          # rather than matching text, so it cannot corrupt the file
          yq -i ".backend.image.tag = strenv(TAG)"  helm/devboard/values.yaml
          yq -i ".frontend.image.tag = strenv(TAG)" helm/devboard/values.yaml

          echo "--- new tags ---"
          yq '.backend.image.tag, .frontend.image.tag' helm/devboard/values.yaml

      - name: Commit and push
        env:
          TAG: ${{ needs.tag.outputs.sha_tag }}
        run: |
          git config user.name "manish-jha18"
          git config user.email "manishkumar181999@gmail.com"

          # nothing to do if the tag did not change - a re-run of the same
          # commit should not create an empty commit
          if git diff --quiet; then
            echo "tags unchanged, nothing to commit"
            exit 0
          fi

          git add helm/devboard/values.yaml
          # [skip ci] so this commit does not re-trigger the workflow.
          # Without it: push -> build -> commit -> push -> build -> forever.
          git commit -m "chore: deploy $TAG [skip ci]"

          # another run may have pushed while this one was building
          git pull --rebase
          git push

      - name: Summary
        env:
          TAG: ${{ needs.tag.outputs.sha_tag }}
        run: |
          {
            echo "## Deployment committed"
            echo "- image tag: \`$TAG\`"
            echo "- ArgoCD will detect this within ~3 minutes, or immediately via webhook"
            echo "- CI is finished; nothing here touched the cluster"
          } >> "$GITHUB_STEP_SUMMARY"
