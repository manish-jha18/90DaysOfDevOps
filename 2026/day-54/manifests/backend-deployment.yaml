# The DevBoard backend, wired to the ConfigMap and Secret above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-backend
  namespace: devboard-dev
  labels:
    app: devboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-backend
  template:
    metadata:
      labels:
        app: devboard-backend
    spec:
      containers:
        - name: devboard-backend
          image: manishjha18/devboard-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: devboard-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_DB
            # $(VAR) refers to env vars declared ABOVE this one -
            # ordering matters, kubernetes substitutes in order
            - name: POSTGRES_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: config-files
              mountPath: /etc/devboard
              readOnly: true
      volumes:
        - name: config-files
          configMap:
            name: devboard-config
            items:
              - key: app.properties
                path: app.properties
