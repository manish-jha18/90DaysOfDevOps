# NOTE: data: values are base64, which is ENCODING not encryption.
# Anyone with get access to secrets in this namespace can decode them.
# Committing this file is only acceptable because these are throwaway
# local values - real secrets belong in Sealed Secrets, SOPS or a vault.
apiVersion: v1
kind: Secret
metadata:
  name: devboard-secrets
  namespace: devboard-dev
type: Opaque
data:
  POSTGRES_PASSWORD: ZGV2Ym9hcmQ=     # devboard
  POSTGRES_DB: ZGV2Ym9hcmQ=           # devboard
---
# stringData takes plain text and kubernetes base64-encodes it for you.
# Much easier to read and review than the data: form above.
apiVersion: v1
kind: Secret
metadata:
  name: devboard-secrets-plain
  namespace: devboard-dev
type: Opaque
stringData:
  POSTGRES_PASSWORD: devboard
  POSTGRES_DB: devboard
