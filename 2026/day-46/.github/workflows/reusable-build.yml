# Day 46 - a reusable workflow. This cannot be triggered on its own;
# something else has to call it.
name: Reusable Build

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the app being built'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: string
    secrets:
      docker_token:
        description: 'Docker Hub token'
        required: true
    outputs:
      build_version:
        description: 'The version string this build produced'
        value: ${{ jobs.build.outputs.build_version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Report what we were asked to build
        run: |
          echo "Building ${{ inputs.app_name }} for ${{ inputs.environment }}"

      - name: Confirm the secret arrived without printing it
        env:
          TOKEN: ${{ secrets.docker_token }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "Docker token is set: true"
          else
            echo "Docker token is set: false"
            exit 1
          fi

      - name: Generate the version string
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "build_version=v1.0-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version is v1.0-$SHORT_SHA"
