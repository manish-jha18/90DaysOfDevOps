# Static inventory. Replace the IPs with your own EC2 instances.
# Ubuntu AMIs log in as `ubuntu`; Amazon Linux uses `ec2-user`.

[webservers]
web1 ansible_host=44.238.114.92
web2 ansible_host=35.164.201.77

[dbservers]
db1 ansible_host=52.10.44.187

# a group of groups - lets you target everything at once
[devboard:children]
webservers
dbservers

[devboard:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/devboard-key.pem
ansible_python_interpreter=/usr/bin/python3

[webservers:vars]
http_port=80
app_env=production

[dbservers:vars]
postgres_port=5432
