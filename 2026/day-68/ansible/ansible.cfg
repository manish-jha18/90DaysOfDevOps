[defaults]
inventory = ./inventory.ini
host_key_checking = False
# stdout is unreadable by default on multi-host runs; yaml callback fixes that
stdout_callback = yaml
# fact gathering hits every host on every run - cache it
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# without this every task prints "changed" timings but not which host was slow
callbacks_enabled = profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# reuse one SSH connection per host instead of reconnecting for every task
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
