apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devboard.fullname" . }}-secrets
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
type: Opaque
# stringData: helm base64-encodes it. Readable in `helm template` output,
# which matters when reviewing a rendered chart.
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  # assembled by the helper so the backend and postgres cannot disagree
  POSTGRES_URL: {{ include "devboard.postgresUrl" . | quote }}
